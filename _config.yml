# Site Settings
locale                   : "en-US"
title                    : "Mohammad Kakooei"
title_separator          : "-"
name                     : &name "Mohammad Kakooei"
description              : &description "Senior Lecturer at Karlstad University | Researcher at Linköping University"
url                      : https://mohammadkakooei.github.io
baseurl                  : ""
repository               : "Mohammadkakooei/MohammadKakooei.github.io"
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  path                   :

# SEO Related
google_site_verification :
bing_site_verification   :

# Social Sharing
twitter:
  username               :

og_image                 :

social:
  type                   : Person
  name                   : Mohammad Kakooei
  links                  :
    - "https://github.com/Mohammadkakooei"
    - "https://www.linkedin.com/in/mohammad-kakooei-33118211a/"
    - "https://www.researchgate.net/profile/Mohammad-Kakooei"

# Analytics
analytics:
  provider               : false

# Site Author
author:
  name             : "Mohammad Kakooei"
  avatar           : "profile.png"          # place your photo at /images/profile.png
  bio              : "Senior Lecturer at Karlstad University. Researcher at Linköping University. ML, AI & Earth Observation."
  location         : "Karlstad, Sweden"
  employer         : "Karlstad University"
  googlescholar    : "https://scholar.google.com/citations?user=rQGuJAsAAAAJ&hl=en&authuser=1"  # update with your ID
  email            : "mohammad.kakooei@kau.se"
  researchgate     : "https://www.researchgate.net/profile/Mohammad-Kakooei"
  github           : "Mohammadkakooei"
  linkedin         : "mohammad-kakooei-33118211a"
  orcid            : "https://orcid.org/0000-0002-2318-8216"
  uri              : "https://www.kau.se/en/researchers/mohammad-kakooei"
  twitter          :
  instagram        :
  facebook         :

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - node_modules
  - package.json
  - tmp
  - vendor

keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: true
      comments: true
  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: true

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Europe/Stockholm

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from

whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development
